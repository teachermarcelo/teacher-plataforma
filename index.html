<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#6844d8;--p2:#8d61ef;--dark:#171522;--bg:#f6f6fa;--card:#fff;--text:#242330;--muted:#858392;--line:#e8e6ef;--green:#18ae78;--yellow:#e5a62e;--red:#dc5964;--blue:#347fe4;--r:18px;--sidebar:255px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.hidden{display:none!important}
.app{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);padding:18px 12px;overflow:auto;z-index:50}.brand{font-weight:800;font-size:21px;padding:8px 12px 18px}.brand span{color:var(--p)}.brand small{display:block;font-size:9px;letter-spacing:1.5px;color:#aaa;margin-top:4px}.user{display:flex;gap:10px;align-items:center;background:#faf9ff;border-radius:14px;padding:10px;margin-bottom:10px}.avatar{width:42px;height:42px;border-radius:12px;background:#eee;object-fit:cover}.user b{font-size:14px}.user small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.nav-label{font-size:10px;font-weight:800;letter-spacing:1.4px;color:#aaa6b5;padding:13px 11px 5px;text-transform:uppercase}.nav{display:grid;gap:3px}.nav button{position:relative;border:0;background:transparent;width:100%;text-align:left;padding:11px;border-radius:11px;color:#777483;font-weight:700}.nav button:hover,.nav button.active{background:#eee8ff;color:var(--p)}.nav button.active:after{content:"";position:absolute;right:7px;top:50%;transform:translateY(-50%);width:4px;height:18px;border-radius:5px;background:var(--p)}.ico{display:inline-block;width:24px}.sidebar-footer{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}.sidebar-footer button{width:100%;border:0;background:transparent;text-align:left;color:#888;padding:10px 11px}
.main{margin-left:var(--sidebar);min-height:100vh}.topbar{height:72px;background:#ffffffee;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px;position:sticky;top:0;z-index:30;backdrop-filter:blur(12px)}.crumb{font-size:12px;color:#9996a5}.top-right{display:flex;align-items:center;gap:9px}.online{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;background:var(--green);border-radius:50%}.icon{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#777}.container{max-width:1250px;margin:auto;padding:25px 28px 60px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:20px}.page-head h1{margin:0;font-size:26px}.page-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:12px}.primary{background:var(--p);color:#fff}.secondary{background:#eee8ff;color:var(--p)}.ghost{background:#fff;border:1px solid var(--line);color:#706d7d}.danger{background:#ffe7e9;color:#a52e3b}.blue{background:#e8f1ff;color:#2462b7}
.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,1fr)}.cols2{grid-template-columns:repeat(2,1fr)}.cols3{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 12px 35px #34245c10}.stat-label{font-size:11px;color:var(--muted)}.stat-value{font-size:25px;font-weight:800;margin-top:6px}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-head h2{font-size:16px;margin:0}.section-head span{font-size:11px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}.row:last-child{margin-bottom:0}.row b{font-size:13px}.row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:800}.green{background:#e2f8ef;color:#14835f}.yellow{background:#fff2d4;color:#986a13}.red{background:#ffe5e8;color:#a52e3c}.gray{background:#f0eff3;color:#777481}.blue-b{background:#e5efff;color:#2464b8}.progress{height:8px;background:#ecebf1;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:99px}.mini{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--line);padding:11px;text-align:left;font-size:12px;vertical-align:middle}.table th{font-size:10px;color:#9995a4;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}.empty{text-align:center;padding:35px;color:var(--muted)}.notice{background:#f5f1ff;border:1px solid #e5dcfb;color:#5c48a1;border-radius:12px;padding:11px;font-size:12px}.hero{background:linear-gradient(135deg,#4d2ba7,#8055dd);color:#fff;border-radius:21px;padding:23px}.hero h2{margin:0 0 4px;font-size:25px}.hero p{margin:0 0 18px;color:#d8d0eb}.hero .progress{background:#ffffff2c}.hero .progress i{background:#fff}.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.skill{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.skill-head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.modal{position:fixed;inset:0;background:#11101b99;backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;z-index:100}.modal-card{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:20px}.modal-card.wide{width:min(1050px,100%)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h3{margin:0;font-size:18px}.close{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;color:#777}.form{display:grid;gap:12px;margin-top:17px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:800;color:#55515f}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff}.field textarea{min-height:120px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #6844d814}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.list-box{border:1px solid var(--line);border-radius:13px;padding:12px}.check-row{display:flex;align-items:center;gap:9px;padding:9px;border-bottom:1px solid var(--line)}.check-row:last-child{border-bottom:0}.check-row input{width:auto}
.course-card{position:relative}.course-title{font-size:17px;font-weight:800}.course-meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.curriculum{display:grid;gap:10px}.module{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.module-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:#faf9ff}.module-head b{font-size:13px}.module-lessons{padding:8px 12px}.lesson-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.lesson-line:last-child{border-bottom:0}.lesson-pos{width:28px;height:28px;border-radius:8px;background:#eee8ff;color:var(--p);display:grid;place-items:center;font-size:11px;font-weight:800}.lesson-info{flex:1}.lesson-info b{font-size:12px}.lesson-info small{display:block;color:var(--muted);font-size:10px}.move-buttons{display:flex;gap:4px}.move-buttons button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 7px;color:#777}
.auth{min-height:100vh;background:linear-gradient(135deg,#171522,#40278d);display:grid;place-items:center;padding:20px}.auth-card{background:#fff;width:min(430px,100%);border-radius:23px;padding:28px;box-shadow:0 30px 90px #0005}.auth-card h1{margin:0;font-size:25px}.auth-card h1 span{color:var(--p)}.auth-card p{color:var(--muted);font-size:12px}.auth-tabs{display:flex;gap:6px;margin:18px 0}.auth-tabs button{flex:1;border:0;background:#f2f0f6;border-radius:9px;padding:10px;font-weight:800;color:#777}.auth-tabs button.active{background:#eee8ff;color:var(--p)}.auth-msg{padding:10px;border-radius:9px;background:#eef3ff;color:#345b9d;font-size:12px;margin-top:10px}
.task-card{scroll-margin-top:90px}.task-card.focus{outline:2px solid var(--p);box-shadow:0 0 0 5px #6844d814}.task-cover{width:100%;max-height:210px;object-fit:cover;border-radius:13px}.answer{background:#faf9ff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:12px}.answer pre{white-space:pre-wrap;font-family:inherit;margin:0;font-size:13px}.feedback{background:#edf9f4;border:1px solid #d7f1e5;border-radius:12px;padding:12px;margin-top:10px}.feedback.private{background:#fff4df;border-color:#f5e3b8}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-weight:800;font-size:11px}.tabs button.active{background:#eee8ff;color:var(--p);border-color:#ddd1fa}
.mobile{display:none}
@media(max-width:1000px){.stats{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){:root{--sidebar:255px}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}.main{margin-left:0}.mobile{display:block}.topbar{padding:0 15px}.container{padding:18px 15px 45px}.page-head{align-items:flex-start;flex-direction:column}.cols2,.cols3,.form-grid,.skills{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.top-right .online{display:none}}
</style>
</head>
<body>
<div id="auth" class="auth hidden">
  <div class="auth-card">
    <h1>Teacher <span>Platform</span></h1>
    <p>English Classroom OS</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="showAuth('login')">Entrar</button>
      <button id="tabRegister" onclick="showAuth('register')">Cadastrar</button>
    </div>
    <div id="loginBox">
      <form class="form" onsubmit="login(event)">
        <div class="field"><label>E-mail</label><input id="email" type="email" required></div>
        <div class="field"><label>Senha</label><input id="password" type="password" required></div>
        <button class="btn primary" type="submit">Entrar</button>
        <button class="btn ghost" type="button" onclick="forgotPassword()">Esqueci minha senha</button>
      </form>
    </div>
    <div id="registerBox" class="hidden">
      <form class="form" onsubmit="register(event)">
        <div class="field"><label>Nome completo</label><input id="rName" required></div>
        <div class="field"><label>WhatsApp</label><input id="rWhatsapp" type="tel" placeholder="(41) 99999-9999" required></div>
        <div class="field"><label>E-mail</label><input id="rEmail" type="email" required></div>
        <div class="field"><label>Senha</label><input id="rPassword" type="password" minlength="6" required></div>
        <button class="btn primary" type="submit">Criar conta</button>
      </form>
    </div>
    <div id="authMsg"></div>
  </div>
</div>

<div id="app" class="app hidden">
<aside id="sidebar" class="sidebar">
  <div class="brand">Teacher <span>Platform</span><small>ENGLISH CLASSROOM OS</small></div>
  <div class="user"><img id="avatar" class="avatar" src="" alt=""><div><b id="userName">—</b><small id="userRole">—</small></div></div>

  <div id="teacherNav">
    <div class="nav-label">Command Center</div>
    <div class="nav">
      <button data-view="overview" onclick="go('overview')"><span class="ico">🏠</span>Overview</button>
      <button data-view="students" onclick="go('students')"><span class="ico">🎓</span>Students</button>
      <button data-view="classes" onclick="go('classes')"><span class="ico">🏫</span>Classes</button>
      <button data-view="courses" onclick="go('courses')"><span class="ico">📚</span>Courses</button>
      <button data-view="lessons" onclick="go('lessons')"><span class="ico">📚</span>Lessons</button>
      <button data-view="lessonplans" onclick="go('lessonplans')"><span class="ico">📝</span>Lesson Plans</button>
      <button data-view="assignments" onclick="go('assignments')"><span class="ico">✅</span>Assignments</button>
      <button data-view="feedback" onclick="go('feedback')"><span class="ico">📝</span>Feedback & Corrections</button>
    </div>
  </div>

  <div id="studentNav" class="hidden">
    <div class="nav-label">My Learning</div>
    <div class="nav">
      <button data-view="student-dashboard" onclick="go('student-dashboard')"><span class="ico">🏠</span>My Dashboard</button>
      <button data-view="student-tasks" onclick="go('student-tasks')"><span class="ico">✅</span>My Tasks</button>
      <button data-view="student-progress" onclick="go('student-progress')"><span class="ico">📊</span>My Progress</button>
      <button data-view="student-lessons" onclick="go('student-lessons')"><span class="ico">📚</span>My Lessons</button>
      <button data-view="calendar" onclick="go('calendar')"><span class="ico">📅</span>Calendar</button>
      <button data-view="messages" onclick="go('messages')"><span class="ico">💬</span>Messages</button>
    </div>
  </div>

  <div class="sidebar-footer"><button onclick="logout()">↪ Sair</button></div>
</aside>

<main class="main">
<header class="topbar">
  <div class="crumb">Teacher Platform / <b id="crumbView">Overview</b></div>
  <div class="top-right"><span class="online"><i class="dot"></i>Online</span><button class="icon mobile" onclick="toggleSide()">☰</button><button class="icon" onclick="go('profile')">◯</button><b id="topName">—</b></div>
</header>
<section id="content" class="container"></section>
</main>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="modalCard" class="modal-card"></div></div>

<script>
const SUPABASE_URL='https://rvgcniaowzmsudzliozf.supabase.co';
const SUPABASE_KEY='sb_publishable_N_xCS0lbbTvG7qWTpAw0ag_vlg1lbHb';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null, profile=null, students=[], lessons=[], courses=[], modules=[], classes=[], assignments=[], taskAssignments=[], submissions=[], feedbacks=[], view='overview';

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const uid=()=>session?.user?.id;
const toast=(m)=>{ $('authMsg').textContent=m; $('authMsg').className='auth-msg'; setTimeout(()=>{if($('authMsg'))$('authMsg').textContent=''},3500) };
const fmtDate=v=>v?new Date(v).toLocaleDateString('pt-BR'): 'Sem prazo';
const levelList=['A0','A1','A2','B1','B2','C1','C2'];
const skillList=['grammar','vocabulary','listening','reading','writing','speaking','pronunciation'];
const typeList=['lesson','activity','quiz','video','reading','assignment'];

function showAuth(which){
  $('loginBox').classList.toggle('hidden',which!=='login'); $('registerBox').classList.toggle('hidden',which!=='register');
  $('tabLogin').classList.toggle('active',which==='login'); $('tabRegister').classList.toggle('active',which==='register');
}
async function login(e){e.preventDefault();try{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;session=data.session;await boot()}catch(e){toast(e.message||'Falha no login')}}
async function register(e){e.preventDefault();try{const name=$('rName').value.trim(),whatsapp=$('rWhatsapp').value.trim(),email=$('rEmail').value.trim(),password=$('rPassword').value;const {data,error}=await sb.auth.signUp({email,password,data:{full_name:name,role:'student',whatsapp}});if(error)throw error;toast(data.session?'Conta criada.':'Conta criada. Verifique o e-mail se necessário.')}catch(e){toast(e.message||'Falha no cadastro')}}
async function forgotPassword(){const email=prompt('Digite seu e-mail para receber o link de recuperação:');if(!email)return;try{const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;toast('Link de recuperação enviado.')}catch(e){toast(e.message||'Não foi possível enviar o link')}}
async function logout(){await sb.auth.signOut();location.reload()}
function toggleSide(){$('sidebar').classList.toggle('open')}
function closeModal(){$('modal').classList.add('hidden');$('modalCard').innerHTML=''}
function modal(title,body,wide=false){$('modalCard').className='modal-card'+(wide?' wide':'');$('modalCard').innerHTML=`<div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div>${body}`;$('modal').classList.remove('hidden')}
function setActive(v){document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('crumbView').textContent=labelView(v);$('sidebar').classList.remove('open')}
function labelView(v){return ({overview:'Overview',students:'Students',classes:'Classes',courses:'Courses',lessons:'Lessons',lessonplans:'Lesson Plans',assignments:'Assignments',feedback:'Feedback & Corrections','student-dashboard':'My Dashboard','student-tasks':'My Tasks','student-progress':'My Progress','student-lessons':'My Lessons',calendar:'Calendar',messages:'Messages',profile:'Profile'})[v]||v}
async function go(v){view=v;setActive(v);if(!profile)return;try{await loadData();render()}catch(e){console.error(e);$('content').innerHTML=`<div class="card"><b>Erro ao carregar</b><p>${esc(e.message)}</p></div>`}}
async function loadData(){
  const q=async(t,select='*')=>{const {data,error}=await sb.from(t).select(select);if(error)throw error;return data||[]};
  const [st,le,co,mo,cl,ta,sub,fb]=await Promise.all([
    q('tic_students'),q('tic_lessons'),q('tic_courses'),q('tic_modules'),q('tic_classes'),q('tic_task_assignments'),q('tic_submissions'),q('tic_feedback')
  ]);
  students=st;lessons=le;courses=co;modules=mo;classes=cl;taskAssignments=ta;submissions=sub;feedbacks=fb;
  if(courses.length){const ids=courses.map(x=>x.id);const {data,error}=await sb.from('tic_assignments').select('*').in('id',ids);if(!error){}}
  const {data:as,error:ae}=await sb.from('tic_assignments').select('*').order('created_at',{ascending:false});if(!ae)assignments=as||[];
}
async function boot(){
  const {data,error}=await sb.auth.getSession();if(error)throw error;session=data.session;if(!session){$('auth').classList.remove('hidden');$('app').classList.add('hidden');return}
  let {data:p}=await sb.from('tic_profiles').select('*').eq('id',uid()).maybeSingle();
  if(!p)p={id:uid(),full_name:session.user.user_metadata?.full_name||session.user.email?.split('@')[0]||'User',email:session.user.email,role:session.user.user_metadata?.role||'student',active:true};
  profile=p;
  $('userName').textContent=p.full_name||'User';$('topName').textContent=p.full_name||'User';$('userRole').textContent=(p.role||'student').toUpperCase();
  $('avatar').src=p.avatar_url||'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="20" fill="%23eeeeee"/><circle cx="40" cy="31" r="14" fill="white"/><path d="M15 72c4-18 46-18 50 0" fill="white"/></svg>';
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  const teacher=['teacher','admin'].includes(p.role);
  $('teacherNav').classList.toggle('hidden',!teacher);$('studentNav').classList.toggle('hidden',teacher);
  view=teacher?'overview':'student-dashboard';setActive(view);await loadData();render();
}
sb.auth.onAuthStateChange((event,s)=>{if(event==='PASSWORD_RECOVERY'){showAuth('login');toast('Crie sua nova senha pelo fluxo de recuperação.')}else if(s&&!session){session=s;boot()}});

function render(){if(['teacher','admin'].includes(profile.role))renderTeacher();else renderStudent()}
function renderTeacher(){
 const map={overview:renderOverview,students:renderStudents,classes:renderClasses,courses:renderCourses,lessons:renderLessons,lessonplans:renderLessonPlans,assignments:renderAssignments,feedback:renderFeedback,profile:renderProfile};
 (map[view]||renderOverview)();
}
function renderOverview(){
 const pending=taskAssignments.filter(x=>x.status==='pending').length, sent=submissions.length, active=students.filter(s=>s.status!=='inactive').length;
 $('content').innerHTML=`<div class="page-head"><div><h1>Overview</h1><p>Centro de controle da sua sala de aula.</p></div></div>
 <div class="grid stats"><div class="card"><div class="stat-label">STUDENTS</div><div class="stat-value">${active}</div></div><div class="card"><div class="stat-label">COURSES</div><div class="stat-value">${courses.length}</div></div><div class="card"><div class="stat-label">LESSONS</div><div class="stat-value">${lessons.length}</div></div><div class="card"><div class="stat-label">SUBMISSIONS</div><div class="stat-value">${sent}</div></div></div>
 <div class="grid cols2 section"><div class="card"><div class="section-head"><h2>Quick actions</h2></div><div class="grid cols2"><button class="btn primary" onclick="openLesson()">+ New Lesson</button><button class="btn secondary" onclick="openCourse()">+ New Course</button><button class="btn secondary" onclick="openAssignment()">+ New Assignment</button><button class="btn secondary" onclick="openClass()">+ New Class</button></div></div>
 <div class="card"><div class="section-head"><h2>Pending work</h2><span>${pending} tarefas</span></div>${pending?taskAssignments.filter(x=>x.status==='pending').slice(0,5).map(x=>{const a=assignments.find(a=>a.id===x.assignment_id),s=students.find(s=>s.id===x.student_id);return `<div class="row"><div><b>${esc(a?.title||'Assignment')}</b><small>${esc(s?.display_name||'Aluno')}</small></div><span class="badge yellow">Pendente</span></div>`}).join(''):'<div class="empty">Tudo em dia.</div>'}</div></div>`;
}
function renderStudents(){
 $('content').innerHTML=`<div class="page-head"><div><h1>Students</h1><p>Alunos, acesso, nível e WhatsApp.</p></div><div class="actions"><button class="btn primary" onclick="openStudent()">+ New Student</button></div></div>
 <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Aluno</th><th>WhatsApp</th><th>Nível</th><th>Status</th><th>Ações</th></tr></thead><tbody>${students.length?students.map(s=>`<tr><td><b>${esc(s.display_name)}</b><br><small>${esc(s.email||'')}</small></td><td>${esc(s.phone||'—')}</td><td>${esc(s.current_level||'—')}</td><td><span class="badge ${s.status==='inactive'?'red':'green'}">${esc(s.status||'active')}</span></td><td><div class="row-actions"><button class="btn secondary" onclick="studentView('${s.id}')">View</button><button class="btn ghost" onclick='openStudent(${JSON.stringify(s)})'>Editar</button><button class="btn ghost" onclick="shareStudent('${s.id}')">📲 WhatsApp</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Nenhum aluno cadastrado.</td></tr>'}</tbody></table></div></div>`;
}
function renderClasses(){
 $('content').innerHTML=`<div class="page-head"><div><h1>Classes</h1><p>Turmas conectadas a cursos, alunos e conteúdo.</p></div><button class="btn primary" onclick="openClass()">+ New Class</button></div>
 <div class="grid cols2">${classes.length?classes.map(c=>{const n=window.classStudentCounts?.[c.id]||0;const course=courses.find(x=>x.id===c.course_id);return `<div class="card"><div class="section-head"><h2>${esc(c.name)}</h2><span>${esc(c.level||'—')}</span></div><p>${esc(course?.title||'Sem curso')} · ${esc(c.schedule_text||'Sem horário')}</p><div class="course-meta"><span class="badge blue-b">${n} aluno(s)</span><span class="badge gray">${esc(c.status||'active')}</span></div><div class="actions"><button class="btn secondary" onclick="manageClass('${c.id}')">👥 Alunos</button><button class="btn secondary" onclick="assignClass('${c.id}')">📤 Atribuir</button><button class="btn ghost" onclick='openClass(${JSON.stringify(c)})'>Editar</button></div></div>`}).join(''):'<div class="card empty">Nenhuma turma criada.</div>'}</div>`;
 loadClassCounts();
}
async function loadClassCounts(){window.classStudentCounts={};if(!classes.length){return}const {data}=await sb.from('tic_class_students').select('class_id');(data||[]).forEach(x=>window.classStudentCounts[x.class_id]=(window.classStudentCounts[x.class_id]||0)+1);renderClasses();}
function renderCourses(){
 $('content').innerHTML=`<div class="page-head"><div><h1>Courses</h1><p>Organize o currículo por nível, módulos e lessons.</p></div><button class="btn primary" onclick="openCourse()">+ New Course</button></div>
 <div class="grid cols2">${courses.length?courses.map(c=>{const ls=lessons.filter(l=>l.course_id===c.id),ms=modules.filter(m=>m.course_id===c.id);return `<div class="card course-card"><div class="section-head"><h2>${esc(c.title)}</h2><span>${esc(c.level||'—')}</span></div><p>${esc(c.description||'Sem descrição')}</p><div class="course-meta"><span class="badge blue-b">${ls.length} lessons</span><span class="badge gray">${ms.length} módulos</span></div><div class="actions"><button class="btn secondary" onclick="openCurriculum('${c.id}')">📚 Currículo</button><button class="btn secondary" onclick="manageCourseStudents('${c.id}')">👥 Alunos</button><button class="btn ghost" onclick='openCourse(${JSON.stringify(c)})'>Editar</button><button class="btn danger" onclick="deleteCourse('${c.id}')">Excluir</button></div></div>`}).join(''):'<div class="card empty">Nenhum curso. Crie o primeiro.</div>'}</div>`;
}
function renderLessons(){
 $('content').innerHTML=`<div class="page-head"><div><h1>Lessons</h1><p>Aulas, conteúdo e recursos.</p></div><button class="btn primary" onclick="openLesson()">+ New Lesson</button></div>
 <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Lesson</th><th>Nível</th><th>Curso</th><th>Módulo</th><th>Skill</th><th>Posição</th><th>Ações</th></tr></thead><tbody>${lessons.length?lessons.slice().sort((a,b)=>(a.position||0)-(b.position||0)).map(l=>{const c=courses.find(x=>x.id===l.course_id),m=modules.find(x=>x.id===l.module_id);return `<tr><td><b>${esc(l.title)}</b></td><td>${esc(l.level||'—')}</td><td>${esc(c?.title||'—')}</td><td>${esc(m?.title||'—')}</td><td>${esc(l.skill||'—')}</td><td>${l.position||0}</td><td><div class="row-actions"><button class="btn ghost" onclick='openLesson(${JSON.stringify(l)})'>Editar</button><button class="btn secondary" onclick="openLessonAssign('${l.id}')">📤 Atribuir</button><button class="btn danger" onclick="deleteLesson('${l.id}')">Excluir</button></div></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">Nenhuma lesson.</td></tr>'}</tbody></table></div></div>`;
}
function renderLessonPlans(){ $('content').innerHTML=`<div class="page-head"><div><h1>Lesson Plans</h1><p>Planejamento pode ser ligado a lessons e atribuído.</p></div></div><div class="card notice">A estrutura de Lesson Plans existente é preservada. Use Assignments para entregar uma Lesson Plan a uma turma ou aluno.</div>`}
function renderAssignments(){
 $('content').innerHTML=`<div class="page-head"><div><h1>Assignments</h1><p>Tarefas para alunos ou turmas.</p></div><button class="btn primary" onclick="openAssignment()">+ New Assignment</button></div>
 <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Tarefa</th><th>Origem</th><th>Prazo</th><th>Pontos</th><th>Atribuída</th><th>Ações</th></tr></thead><tbody>${assignments.length?assignments.map(a=>{const src=a.lesson_id?lessons.find(l=>l.id===a.lesson_id):null;const n=taskAssignments.filter(t=>t.assignment_id===a.id).length;return `<tr><td><b>${esc(a.title)}</b><br><small>${esc(a.assignment_type||'assignment')}</small></td><td>${esc(src?.title||a.source_type||'—')}</td><td>${fmtDate(a.due_at)}</td><td>${a.points??'—'}</td><td>${n}</td><td><div class="row-actions"><button class="btn secondary" onclick="assignExisting('${a.id}')">📤 Atribuir</button><button class="btn ghost" onclick='openAssignment(${JSON.stringify(a)})'>Editar</button></div></td></tr>`}).join(''):'<tr><td colspan="6" class="empty">Nenhuma assignment.</td></tr>'}</tbody></table></div></div>`;
}
function renderFeedback(){
 const rows=taskAssignments.map(ta=>{const a=assignments.find(x=>x.id===ta.assignment_id),s=students.find(x=>x.id===ta.student_id),sub=submissions.find(x=>x.task_assignment_id===ta.id),f=feedbacks.find(x=>x.submission_id===sub?.id);return {ta,a,s,sub,f}}).filter(x=>x.a);
 $('content').innerHTML=`<div class="page-head"><div><h1>Feedback & Corrections</h1><p>Entregas dos alunos, notas e feedback.</p></div></div>
 <div class="grid stats"><div class="card"><div class="stat-label">ATRIBUÍDAS</div><div class="stat-value">${rows.length}</div></div><div class="card"><div class="stat-label">ENTREGAS</div><div class="stat-value">${rows.filter(x=>x.sub).length}</div></div><div class="card"><div class="stat-label">AGUARDANDO</div><div class="stat-value">${rows.filter(x=>!x.sub).length}</div></div><div class="card"><div class="stat-label">CORRIGIDAS</div><div class="stat-value">${rows.filter(x=>x.f).length}</div></div></div>
 <div class="card section"><div class="table-wrap"><table class="table"><thead><tr><th>Aluno</th><th>Tarefa</th><th>Entrega</th><th>Nota</th><th>Ação</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><b>${esc(x.s?.display_name||'Aluno')}</b></td><td>${esc(x.a.title)}</td><td>${x.sub?fmtDate(x.sub.submitted_at):'—'}</td><td>${x.f?.grade??x.sub?.grade??'—'}</td><td>${x.sub?`<button class="btn secondary" onclick="gradeSubmission('${x.sub.id}','${x.ta.id}')">📝 Corrigir</button>`:'<span class="badge gray">Aguardando entrega</span>'}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Nenhuma atribuição.</td></tr>'}</tbody></table></div></div>`;
}
function renderStudent(){
 const map={'student-dashboard':renderStudentDashboard,'student-tasks':renderStudentTasks,'student-progress':renderStudentProgress,'student-lessons':renderStudentLessons,calendar:renderCalendar,messages:renderMessages,profile:renderProfile};
 (map[view]||renderStudentDashboard)();
}
function myStudent(){return students.find(s=>s.auth_user_id===uid())||students.find(s=>s.email===session?.user?.email)}
function renderStudentDashboard(){
 const s=myStudent(), tas=s?taskAssignments.filter(t=>t.student_id===s.id):[], rows=tas.map(t=>({...t,a:assignments.find(a=>a.id===t.assignment_id),sub:submissions.find(x=>x.task_assignment_id===t.id),f:feedbacks.find(x=>x.submission_id===submissions.find(y=>y.task_assignment_id===t.id)?.id)}));
 $('content').innerHTML=`<div class="hero"><small>CURRENT LEVEL</small><h2>${esc(s?.current_level||'A0')} → —</h2><p>Progresso geral calculado a partir das suas atividades.</p><div class="progress"><i style="width:${studentOverall(rows)}%"></i></div></div>
 <div class="grid cols2 section"><div class="card"><div class="section-head"><h2>✅ My Tasks</h2><button class="btn secondary" onclick="go('student-tasks')">Ver todas</button></div>${rows.length?rows.slice(0,5).map(x=>taskRowStudent(x)).join(''):'<div class="empty">Nenhuma tarefa atribuída.</div>'}</div><div class="card"><div class="section-head"><h2>📊 My Progress</h2></div>${skillsHtml()}</div></div>
 <div class="card section"><div class="section-head"><h2>💰 My Payments</h2></div><div class="empty">Nenhum registro disponível.</div></div>`;
}
function taskRowStudent(x){let st=x.f?'reviewed':x.sub?'submitted':x.ta.status==='completed'?'completed':'pending';return `<div class="row task-card"><div><b>${esc(x.a?.title||'Tarefa')}</b><small>${fmtDate(x.a?.due_at)}</small></div><div class="row-actions"><span class="badge ${st==='reviewed'||st==='completed'?'green':st==='submitted'?'blue-b':'yellow'}">${st}</span><button class="btn secondary" onclick="openStudentTask('${x.ta.id}')">Abrir</button></div></div>`}
function studentOverall(rows){const done=rows.filter(x=>x.f||x.sub||x.ta.status==='completed').length;return rows.length?Math.round(done/rows.length*100):0}
function skillsHtml(){return skillList.map(k=>`<div class="skill"><div class="skill-head"><span>${k}</span><b>0%</b></div><div class="progress"><i style="width:0%"></i></div></div>`).join('')}
function renderStudentTasks(){
 const s=myStudent(),tas=s?taskAssignments.filter(t=>t.student_id===s.id):[],rows=tas.map(t=>({...t,a:assignments.find(a=>a.id===t.assignment_id),sub:submissions.find(x=>x.task_assignment_id===t.id),f:feedbacks.find(x=>x.submission_id===submissions.find(y=>y.task_assignment_id===t.id)?.id)}));
 $('content').innerHTML=`<div class="page-head"><div><h1>My Tasks</h1><p>Abra, responda e envie suas atividades.</p></div></div>${rows.length?rows.map(x=>taskCardStudent(x)).join(''):'<div class="card empty">Você ainda não recebeu tarefas.</div>'}`;
}
function taskCardStudent(x){
 const status=x.f?'reviewed':x.sub?'submitted':x.ta.status==='completed'?'completed':'pending';
 return `<div id="task-${x.ta.id}" class="card task-card section"><div class="section-head"><div><h2>${esc(x.a?.title||'Tarefa')}</h2><span>${fmtDate(x.a?.due_at)} · ${x.a?.points??'—'} pontos</span></div><span class="badge ${status==='reviewed'||status==='completed'?'green':status==='submitted'?'blue-b':'yellow'}">${status}</span></div>
 ${x.a?.cover_image_url?`<img class="task-cover" src="${esc(x.a.cover_image_url)}">`:''}
 <div class="notice">${esc(x.a?.instructions||'Leia as instruções e envie sua resposta.')}</div>
 ${x.a?.resource_items?.length?`<div class="section"><b>Recursos</b>${x.a.resource_items.map(r=>`<div class="row"><div><b>${esc(r.title||r.label||'Recurso')}</b><small>${esc(r.url||r.content||'')}</small></div></div>`).join('')}</div>`:''}
 ${x.sub?`<div class="answer"><b>📤 Sua entrega</b><pre>${esc(x.sub.answer_text||'Sem texto')}</pre>${x.sub.file_url?`<p><a href="${esc(x.sub.file_url)}" target="_blank">📎 Abrir arquivo</a></p>`:''}</div>`:''}
 ${x.f?`<div class="feedback"><b>💬 Feedback do Teacher</b><p>${esc(x.f.comment||'Sem comentário')}</p><strong>Nota: ${x.f.grade??x.sub?.grade??'—'}</strong></div>`:''}
 ${!x.f?`<form class="form" onsubmit="submitTask(event,'${x.ta.id}')"><div class="field"><label>Sua resposta</label><textarea id="ans-${x.ta.id}" placeholder="Digite sua resposta aqui...">${esc(x.sub?.answer_text||'')}</textarea></div><div class="field"><label>Link de arquivo (opcional)</label><input id="file-${x.ta.id}" value="${esc(x.sub?.file_url||'')}" placeholder="https://..."></div><button class="btn primary" type="submit">📤 ${x.sub?'Atualizar entrega':'Enviar para o Teacher'}</button></form>`:''}
 </div>`;
}
async function openStudentTask(id){go('student-tasks');setTimeout(()=>{const el=$('task-'+id);if(el){el.scrollIntoView({behavior:'smooth'});el.classList.add('focus');setTimeout(()=>el.classList.remove('focus'),2500)}},250)}
function renderStudentProgress(){const s=myStudent();$('content').innerHTML=`<div class="page-head"><div><h1>My Progress</h1><p>${esc(s?.display_name||'Aluno')} · ${esc(s?.current_level||'A0')}</p></div></div><div class="card"><div class="hero"><small>OVERALL PROGRESS</small><h2>0%</h2><p>O progresso será atualizado conforme tarefas e aulas forem concluídas.</p><div class="progress"><i style="width:0%"></i></div></div><div class="skills section">${skillsHtml()}</div></div>`}
function renderStudentLessons(){
 const s=myStudent();const ownCourses=[]; // carregamento abaixo preserva fallback por nível
 $('content').innerHTML=`<div class="page-head"><div><h1>My Lessons</h1><p>Aulas disponíveis organizadas por curso e módulo.</p></div></div><div id="studentLessonsBox"><div class="card empty">Carregando currículo...</div></div>`;
 loadStudentCurriculum(s);
}
async function loadStudentCurriculum(s){
 let enrolled=[];
 if(s){const {data}=await sb.from('tic_course_students').select('course_id').eq('student_id',s.id);enrolled=data||[]}
 const courseIds=enrolled.map(x=>x.course_id);let cs=courses.filter(c=>courseIds.includes(c.id));if(!cs.length)cs=courses.filter(c=>!s?.current_level||c.level===s.current_level);
 const ls=lessons.filter(l=>cs.some(c=>c.id===l.course_id));const ms=modules.filter(m=>cs.some(c=>c.id===m.course_id));
 let html=cs.length?cs.map(c=>`<div class="card section"><div class="section-head"><h2>📚 ${esc(c.title)}</h2><span>${ls.filter(l=>l.course_id===c.id).length} lessons · ${ms.filter(m=>m.course_id===c.id).length} módulos</span></div>${ms.filter(m=>m.course_id===c.id).sort((a,b)=>a.position-b.position).map(m=>`<div class="module section"><div class="module-head"><b>${esc(m.title)}</b><span>${ls.filter(l=>l.module_id===m.id).length} lessons</span></div><div class="module-lessons">${ls.filter(l=>l.module_id===m.id).sort((a,b)=>a.position-b.position).map(l=>`<div class="lesson-line"><div class="lesson-pos">${l.position||1}</div><div class="lesson-info"><b>${esc(l.title)}</b><small>${esc(l.skill||'')} · ${esc(l.level||'')}</small></div><button class="btn secondary" onclick="viewLessonStudent('${l.id}')">Abrir</button></div>`).join('')||'<div class="empty">Nenhuma lesson neste módulo.</div>'}</div></div>`).join('')||'<div class="notice">Nenhum módulo criado neste curso.</div>'}</div>`).join(''):'<div class="card empty">Nenhum curso disponível para você ainda.</div>';
 $('studentLessonsBox').innerHTML=html;
}
function renderCalendar(){$('content').innerHTML=`<div class="page-head"><div><h1>Calendar</h1><p>Prazos das atividades.</p></div></div><div class="card">${assignments.filter(a=>a.due_at).sort((a,b)=>new Date(a.due_at)-new Date(b.due_at)).map(a=>`<div class="row"><div><b>${esc(a.title)}</b><small>${fmtDate(a.due_at)}</small></div><span class="badge yellow">Prazo</span></div>`).join('')||'<div class="empty">Nenhum evento.</div>'}</div>`}
function renderMessages(){$('content').innerHTML=`<div class="page-head"><div><h1>Messages</h1><p>Comunicação com o Teacher.</p></div></div><div class="card empty">A área de mensagens está preparada para integração com chat.</div>`}
function renderProfile(){$('content').innerHTML=`<div class="page-head"><div><h1>Profile</h1><p>Seus dados de acesso.</p></div></div><div class="card"><div class="form-grid"><div><b>Nome</b><p>${esc(profile.full_name)}</p></div><div><b>E-mail</b><p>${esc(profile.email||session?.user?.email)}</p></div><div><b>WhatsApp</b><p>${esc(profile.whatsapp||'—')}</p></div><div><b>Perfil</b><p>${esc(profile.role)}</p></div></div></div>`}

function openStudent(s=null){
 const isEdit=!!s;
 modal(isEdit?'Editar aluno':'Novo aluno',`<form class="form" onsubmit="saveStudent(event,${isEdit?`'${s.id}'`:'null'})">
 <div class="form-grid"><div class="field"><label>Nome</label><input id="sn" value="${esc(s?.display_name||'')}" required></div><div class="field"><label>WhatsApp</label><input id="sp" value="${esc(s?.phone||'')}" placeholder="(41) 99999-9999"></div></div>
 <div class="form-grid"><div class="field"><label>E-mail</label><input id="se" type="email" value="${esc(s?.email||'')}"></div><div class="field"><label>Nível</label><select id="sl">${levelList.map(x=>`<option ${x===s?.current_level?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <div class="form-grid"><div class="field"><label>Nível alvo</label><select id="stl"><option value="">—</option>${levelList.map(x=>`<option ${x===s?.target_level?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="ss"><option value="active" ${s?.status!=='inactive'?'selected':''}>active</option><option value="inactive" ${s?.status==='inactive'?'selected':''}>inactive</option></select></div></div>
 <div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form>`);
}
async function saveStudent(e,id){e.preventDefault();const obj={display_name:$('sn').value.trim(),phone:$('sp').value.trim(),email:$('se').value.trim()||null,current_level:$('sl').value,target_level:$('stl').value||null,status:$('ss').value};try{let r;if(id)r=await sb.from('tic_students').update(obj).eq('id',id);else{obj.teacher_id=uid();r=await sb.from('tic_students').insert(obj)}if(r.error)throw r.error;closeModal();await loadData();renderStudents()}catch(e){alert(e.message)}}
function studentView(id){const s=students.find(x=>x.id===id);if(!s)return;modal('Student View',`<div class="card"><h2>${esc(s.display_name)}</h2><p>${esc(s.email||'')} · ${esc(s.phone||'')}</p><div class="course-meta"><span class="badge blue-b">${esc(s.current_level)}</span><span class="badge green">${esc(s.status)}</span></div></div>`)}
function shareStudent(id){const s=students.find(x=>x.id===id);if(!s)return;let phone=(s.phone||'').replace(/\D/g,'');if(phone&&phone.length<=11)phone='55'+phone;const link=location.origin+location.pathname;const msg=`Olá, ${s.display_name}! 👋\\n\\nSeu acesso à Teacher Platform está disponível.\\nAcesse: ${link}\\n\\nSe precisar redefinir sua senha, use "Esqueci minha senha" na tela de login.`;modal('Compartilhar acesso',`<div class="field"><label>Mensagem</label><textarea id="shareText">${esc(msg)}</textarea></div><div class="modal-actions"><button class="btn ghost" onclick="navigator.clipboard.writeText($('shareText').value);alert('Copiado!')">Copiar</button>${phone?`<a class="btn primary" target="_blank" href="https://wa.me/${phone}?text=${encodeURIComponent(msg)}">Abrir WhatsApp</a>`:''}</div>`)}
function openCourse(c=null){const isEdit=!!c;modal(isEdit?'Editar curso':'Novo curso',`<form class="form" onsubmit="saveCourse(event,${isEdit?`'${c.id}'`:'null'})"><div class="field"><label>Nome do curso</label><input id="ct" value="${esc(c?.title||'')}" required></div><div class="form-grid"><div class="field"><label>Nível CEFR</label><select id="cl">${levelList.map(x=>`<option ${x===c?.level?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Ativo</label><select id="ca"><option value="true" ${c?.active!==false?'selected':''}>Sim</option><option value="false" ${c?.active===false?'selected':''}>Não</option></select></div></div><div class="field"><label>Descrição</label><textarea id="cd">${esc(c?.description||'')}</textarea></div><div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form>`)}
async function saveCourse(e,id){e.preventDefault();const obj={title:$('ct').value.trim(),level:$('cl').value,description:$('cd').value.trim(),active:$('ca').value==='true',teacher_id:uid()};try{const r=id?await sb.from('tic_courses').update(obj).eq('id',id):await sb.from('tic_courses').insert(obj);if(r.error)throw r.error;closeModal();await loadData();renderCourses()}catch(e){alert(e.message)}}
async function deleteCourse(id){if(!confirm('Excluir este curso?'))return;const {error}=await sb.from('tic_courses').delete().eq('id',id);if(error)alert(error.message);else{await loadData();renderCourses()}}
function openLesson(l=null){const isEdit=!!l;modal(isEdit?'Editar lesson':'Nova lesson',`<form class="form" onsubmit="saveLesson(event,${isEdit?`'${l.id}'`:'null'})"><div class="field"><label>Título</label><input id="lt" value="${esc(l?.title||'')}" required></div><div class="form-grid"><div class="field"><label>Nível</label><select id="ll">${levelList.map(x=>`<option ${x===l?.level?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Skill</label><select id="lk">${skillList.map(x=>`<option ${x===l?.skill?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="form-grid"><div class="field"><label>Curso</label><select id="lc"><option value="">Sem curso</option>${courses.map(c=>`<option value="${c.id}" ${c.id===l?.course_id?'selected':''}>${esc(c.title)} · ${esc(c.level||'')}</option>`).join('')}</select></div><div class="field"><label>Módulo</label><select id="lm"><option value="">Sem módulo</option>${modules.map(m=>`<option value="${m.id}" ${m.id===l?.module_id?'selected':''}>${esc(m.title)}</option>`).join('')}</select></div></div><div class="form-grid"><div class="field"><label>Tipo</label><select id="ltype">${typeList.map(x=>`<option ${x===l?.lesson_type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Posição</label><input id="lpos" type="number" min="1" value="${l?.position||nextPosition(l?.course_id)}"></div></div><div class="field"><label>Descrição / conteúdo</label><textarea id="lcnt">${esc(l?.content||l?.description||'')}</textarea></div><div class="form-grid"><div class="field"><label>Vídeo URL</label><input id="lv" value="${esc(l?.video_url||'')}"></div><div class="field"><label>PDF URL</label><input id="lp" value="${esc(l?.pdf_url||'')}"></div></div><div class="field"><label>Imagem de capa</label><input id="lcover" value="${esc(l?.cover_image_url||'')}"></div><div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar lesson</button></div></form>`)}
function nextPosition(courseId){return lessons.filter(l=>l.course_id===courseId).length+1}
async function saveLesson(e,id){e.preventDefault();const course=$('lc').value||null;const obj={title:$('lt').value.trim(),level:$('ll').value,skill:$('lk').value,course_id:course,module_id:$('lm').value||null,lesson_type:$('ltype').value,position:Number($('lpos').value)||1,content:$('lcnt').value,video_url:$('lv').value||null,pdf_url:$('lp').value||null,cover_image_url:$('lcover').value||null,teacher_id:uid(),active:true};try{const r=id?await sb.from('tic_lessons').update(obj).eq('id',id):await sb.from('tic_lessons').insert(obj);if(r.error)throw r.error;closeModal();await loadData();renderLessons()}catch(e){alert(e.message)}}
async function deleteLesson(id){if(!confirm('Excluir esta lesson?'))return;const {error}=await sb.from('tic_lessons').delete().eq('id',id);if(error)alert(error.message);else{await loadData();renderLessons()}}
function openCurriculum(courseId){const c=courses.find(x=>x.id===courseId);const ms=modules.filter(m=>m.course_id===courseId).sort((a,b)=>a.position-b.position);modal(`Currículo · ${esc(c.title)}`,`<div class="notice">Aqui você organiza o curso em módulos e reordena as lessons. A lesson também pode ser movida/editada diretamente.</div><div class="actions section"><button class="btn primary" onclick="openModule('${courseId}')">+ Novo módulo</button><button class="btn secondary" onclick="openLesson(null)">+ Nova lesson</button></div><div class="curriculum section">${ms.map(m=>moduleHtml(m,courseId)).join('')||'<div class="empty">Nenhum módulo. Crie o primeiro.</div>'}</div>`,true)}
function moduleHtml(m,courseId){const ls=lessons.filter(l=>l.module_id===m.id).sort((a,b)=>a.position-b.position);return `<div class="module"><div class="module-head"><div><b>${esc(m.title)}</b><small> · ${ls.length} lesson(s)</small></div><div class="row-actions"><button class="btn ghost" onclick='openModule(${JSON.stringify(m)})'>Editar</button><button class="btn danger" onclick="deleteModule('${m.id}','${courseId}')">Excluir</button></div></div><div class="module-lessons">${ls.map((l,i)=>`<div class="lesson-line"><div class="lesson-pos">${i+1}</div><div class="lesson-info"><b>${esc(l.title)}</b><small>${esc(l.skill||'')} · ${esc(l.level||'')}</small></div><div class="move-buttons"><button onclick="moveLesson('${l.id}',-1,'${courseId}')">↑</button><button onclick="moveLesson('${l.id}',1,'${courseId}')">↓</button></div><button class="btn ghost" onclick='openLesson(${JSON.stringify(l)})'>Editar</button></div>`).join('')||'<div class="empty">Nenhuma lesson neste módulo.</div>'}</div></div>`}
function openModule(mOrCourse){const isEdit=typeof mOrCourse==='object';const m=isEdit?mOrCourse:null;const courseId=isEdit?m.course_id:mOrCourse;modal(isEdit?'Editar módulo':'Novo módulo',`<form class="form" onsubmit="saveModule(event,${isEdit?`'${m.id}'`:'null'},'${courseId}')"><div class="field"><label>Nome do módulo</label><input id="mt" value="${esc(m?.title||'')}" required></div><div class="field"><label>Descrição</label><textarea id="md">${esc(m?.description||'')}</textarea></div><div class="field"><label>Posição</label><input id="mp" type="number" min="1" value="${m?.position||modules.filter(x=>x.course_id===courseId).length+1}"></div><div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form>`)}
async function saveModule(e,id,courseId){e.preventDefault();const obj={course_id:courseId,title:$('mt').value.trim(),description:$('md').value.trim(),position:Number($('mp').value)||1};try{const r=id?await sb.from('tic_modules').update(obj).eq('id',id):await sb.from('tic_modules').insert(obj);if(r.error)throw r.error;closeModal();await loadData();openCurriculum(courseId)}catch(e){alert(e.message)}}
async function deleteModule(id,courseId){if(!confirm('Excluir módulo? Lessons ligadas ficarão sem módulo.'))return;const {error}=await sb.from('tic_modules').delete().eq('id',id);if(error)alert(error.message);else{await loadData();openCurriculum(courseId)}}
async function moveLesson(id,dir,courseId){const ls=lessons.filter(l=>l.module_id===lessons.find(x=>x.id===id)?.module_id).sort((a,b)=>a.position-b.position),i=ls.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=ls.length)return;const a=ls[i],b=ls[j];await sb.from('tic_lessons').update({position:b.position}).eq('id',a.id);await sb.from('tic_lessons').update({position:a.position}).eq('id',b.id);await loadData();openCurriculum(courseId)}
function openClass(c=null){const isEdit=!!c;modal(isEdit?'Editar turma':'Nova turma',`<form class="form" onsubmit="saveClass(event,${isEdit?`'${c.id}'`:'null'})"><div class="field"><label>Nome</label><input id="cn" value="${esc(c?.name||'')}" required></div><div class="form-grid"><div class="field"><label>Curso</label><select id="cc"><option value="">Sem curso</option>${courses.map(x=>`<option value="${x.id}" ${x.id===c?.course_id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><div class="field"><label>Nível</label><select id="ccl">${levelList.map(x=>`<option ${x===c?.level?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Horário</label><input id="cs" value="${esc(c?.schedule_text||'')}" placeholder="Seg/Qua · 19:00"></div><div class="field"><label>Link da aula</label><input id="cu" value="${esc(c?.meeting_url||'')}"></div><div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form>`)}
async function saveClass(e,id){e.preventDefault();const obj={name:$('cn').value.trim(),course_id:$('cc').value||null,level:$('ccl').value,schedule_text:$('cs').value,meeting_url:$('cu').value,status:'active',teacher_id:uid()};try{const r=id?await sb.from('tic_classes').update(obj).eq('id',id):await sb.from('tic_classes').insert(obj);if(r.error)throw r.error;closeModal();await loadData();renderClasses()}catch(e){alert(e.message)}}
async function manageClass(classId){const c=classes.find(x=>x.id===classId);const {data:links}=await sb.from('tic_class_students').select('student_id').eq('class_id',classId);const selected=new Set((links||[]).map(x=>x.student_id));modal(`Alunos · ${esc(c.name)}`,`<div class="notice">Selecione os alunos que pertencem a esta turma.</div><div class="list-box section">${students.map(s=>`<label class="check-row"><input type="checkbox" class="classStudent" value="${s.id}" ${selected.has(s.id)?'checked':''}> <span><b>${esc(s.display_name)}</b> · ${esc(s.current_level||'')}</span></label>`).join('')||'<div class="empty">Nenhum aluno cadastrado.</div>'}</div><div class="modal-actions"><button class="btn primary" onclick="saveClassStudents('${classId}')">Salvar alunos</button></div>`)}
async function saveClassStudents(classId){const ids=[...document.querySelectorAll('.classStudent:checked')].map(x=>x.value);const {error:d}=await sb.from('tic_class_students').delete().eq('class_id',classId);if(d){alert(d.message);return}if(ids.length){const {error}=await sb.from('tic_class_students').insert(ids.map(student_id=>({class_id:classId,student_id,status:'active'})));if(error){alert(error.message);return}}closeModal();await loadData();renderClasses()}
function assignClass(classId){assignExisting(null,classId)}
function assignExisting(assignmentId,classId=null){const a=assignmentId?assignments.find(x=>x.id===assignmentId):null;modal('Atribuir conteúdo',`<form class="form" onsubmit="saveAssignmentTargets(event,'${assignmentId||''}','${classId||''}')"><div class="field"><label>Conteúdo</label><select id="atContent">${assignments.map(x=>`<option value="${x.id}" ${x.id===assignmentId?'selected':''}>📝 ${esc(x.title)}</option>`).join('')}</select></div><div class="field"><label>Destino</label><select id="atClass"><option value="">Aluno(s) individualmente</option>${classes.map(x=>`<option value="${x.id}" ${x.id===classId?'selected':''}>🏫 ${esc(x.name)}</option>`).join('')}</select></div><div class="list-box"><b>Ou selecione alunos</b>${students.map(s=>`<label class="check-row"><input class="targetStudent" type="checkbox" value="${s.id}"> ${esc(s.display_name)} · ${esc(s.current_level||'')}</label>`).join('')}</div><div class="modal-actions"><button class="btn primary">Atribuir</button></div></form>`)}
async function saveAssignmentTargets(e,oldId,oldClass){e.preventDefault();const aid=$('atContent').value,cid=$('atClass').value||null;let ids=[...document.querySelectorAll('.targetStudent:checked')].map(x=>x.value);if(cid){const {data}=await sb.from('tic_class_students').select('student_id').eq('class_id',cid);ids=[...new Set((data||[]).map(x=>x.student_id).concat(ids))]}if(!aid||!ids.length){alert('Escolha uma turma ou pelo menos um aluno.');return}const payload=ids.map(student_id=>({assignment_id:aid,student_id,status:'pending'}));const {error}=await sb.from('tic_task_assignments').upsert(payload,{onConflict:'assignment_id,student_id'});if(error)alert(error.message);else{closeModal();await loadData();if(view==='classes')renderClasses();else renderAssignments()}}
function openLessonAssign(lessonId){let a=assignments.find(x=>x.lesson_id===lessonId);if(!a){alert('Esta lesson ainda não possui Assignment. Crie um Assignment ligado à lesson primeiro.');return}assignExisting(a.id)}
function openAssignment(a=null){const isEdit=!!a;modal(isEdit?'Editar assignment':'Nova assignment',`<form class="form" onsubmit="saveAssignment(event,${isEdit?`'${a.id}'`:'null'})"><div class="field"><label>Título</label><input id="at" value="${esc(a?.title||'')}" required></div><div class="form-grid"><div class="field"><label>Lesson origem</label><select id="al"><option value="">Nenhuma</option>${lessons.map(l=>`<option value="${l.id}" ${l.id===a?.lesson_id?'selected':''}>${esc(l.title)}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select id="aty">${typeList.map(x=>`<option ${x===a?.assignment_type?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="form-grid"><div class="field"><label>Prazo</label><input id="ad" type="datetime-local" value="${a?.due_at?new Date(a.due_at).toISOString().slice(0,16):''}"></div><div class="field"><label>Pontos</label><input id="ap" type="number" min="0" value="${a?.points??100}"></div></div><div class="field"><label>Instruções</label><textarea id="ai">${esc(a?.instructions||'')}</textarea></div><div class="modal-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar assignment</button></div></form>`)}
async function saveAssignment(e,id){e.preventDefault();const lessonId=$('al').value||null;const obj={teacher_id:uid(),lesson_id:lessonId,title:$('at').value.trim(),instructions:$('ai').value,assignment_type:$('aty').value,due_at:$('ad').value?new Date($('ad').value).toISOString():null,points:Number($('ap').value)||100,priority:'normal',source_type:lessonId?'lesson':null,source_id:lessonId,resource_items:[]};try{const r=id?await sb.from('tic_assignments').update(obj).eq('id',id):await sb.from('tic_assignments').insert(obj);if(r.error)throw r.error;closeModal();await loadData();renderAssignments()}catch(e){alert(e.message)}}
async function submitTask(e,taId){e.preventDefault();const s=myStudent();if(!s){alert('Aluno não vinculado ao cadastro.');return}const answer=$('ans-'+taId).value,file=$('file-'+taId).value||null;try{const existing=submissions.find(x=>x.task_assignment_id===taId);let r;if(existing)r=await sb.from('tic_submissions').update({answer_text:answer,file_url:file,submitted_at:new Date().toISOString()}).eq('id',existing.id);else r=await sb.from('tic_submissions').insert({task_assignment_id:taId,student_id:s.id,answer_text:answer,file_url:file,attempt:1});if(r.error)throw r.error;await sb.from('tic_task_assignments').update({status:'submitted',completed_at:null}).eq('id',taId);await loadData();renderStudentTasks();alert('Entrega enviada ao Teacher!')}catch(e){alert(e.message)}}
function gradeSubmission(subId,taId){const sub=submissions.find(x=>x.id===subId),f=feedbacks.find(x=>x.submission_id===subId);modal('Corrigir entrega',`<div class="answer"><b>Entrega do aluno</b><pre>${esc(sub?.answer_text||'')}</pre>${sub?.file_url?`<p><a href="${esc(sub.file_url)}" target="_blank">📎 Arquivo</a></p>`:''}</div><form class="form" onsubmit="saveFeedback(event,'${subId}','${taId}',${f?`'${f.id}'`:'null'})"><div class="field"><label>Nota</label><input id="fg" type="number" min="0" max="100" value="${f?.grade??sub?.grade??''}" required></div><div class="field"><label>Feedback para o aluno</label><textarea id="fc">${esc(f?.comment||'')}</textarea></div><div class="field"><label>Nota privada?</label><select id="fp"><option value="false" ${!f?.private_note?'selected':''}>Não — aluno vê</option><option value="true" ${f?.private_note?'selected':''}>Sim — somente Teacher</option></select></div><div class="modal-actions"><button class="btn primary">Salvar correção</button></div></form>`)}
async function saveFeedback(e,subId,taId,fid){e.preventDefault();const grade=Number($('fg').value),comment=$('fc').value,private_note=$('fp').value==='true';try{let r;if(fid)r=await sb.from('tic_feedback').update({grade,comment,private_note}).eq('id',fid);else r=await sb.from('tic_feedback').insert({submission_id:subId,teacher_id:uid(),grade,comment,private_note});if(r.error)throw r.error;await sb.from('tic_submissions').update({grade}).eq('id',subId);await sb.from('tic_task_assignments').update({status:'reviewed',completed_at:new Date().toISOString()}).eq('id',taId);closeModal();await loadData();renderFeedback()}catch(e){alert(e.message)}}
async function manageCourseStudents(courseId){const c=courses.find(x=>x.id===courseId);const {data:links,error}=await sb.from('tic_course_students').select('student_id').eq('course_id',courseId);if(error){alert(error.message);return}const selected=new Set((links||[]).map(x=>x.student_id));modal(`Alunos · ${esc(c.title)}`,`<div class="notice">Matricule alunos neste curso. A matrícula define o currículo principal que aparece em My Lessons.</div><div class="list-box section">${students.map(s=>`<label class="check-row"><input class="courseStudent" type="checkbox" value="${s.id}" ${selected.has(s.id)?'checked':''}> <span><b>${esc(s.display_name)}</b> · ${esc(s.current_level||'')}</span></label>`).join('')}</div><div class="modal-actions"><button class="btn primary" onclick="saveCourseStudents('${courseId}')">Salvar matrícula</button></div>`)}
async function saveCourseStudents(courseId){const ids=[...document.querySelectorAll('.courseStudent:checked')].map(x=>x.value);const {error:d}=await sb.from('tic_course_students').delete().eq('course_id',courseId);if(d){alert(d.message);return}if(ids.length){const {error}=await sb.from('tic_course_students').insert(ids.map(student_id=>({course_id:courseId,student_id,status:'active'})));if(error){alert(error.message);return}}closeModal();alert('Matrículas atualizadas.');}
function viewLessonStudent(id){const l=lessons.find(x=>x.id===id);if(!l)return;modal(esc(l.title),`<div class="notice">${esc(l.level||'')} · ${esc(l.skill||'')}</div><div class="section manual-resource">${esc(l.content||l.description||'Sem conteúdo')}</div>${l.video_url?`<p><a class="btn secondary" href="${esc(l.video_url)}" target="_blank">▶ Vídeo</a></p>`:''}${l.pdf_url?`<p><a class="btn secondary" href="${esc(l.pdf_url)}" target="_blank">📄 PDF</a></p>`:''}`)}
</script>
<script>
(async()=>{try{await boot()}catch(e){console.error(e);$('auth').classList.remove('hidden');$('app').classList.add('hidden');toast(e.message||'Erro ao iniciar')}})();
</script>
</body>
</html>
