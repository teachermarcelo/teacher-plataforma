<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ready Class · Aula do aluno</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17233e;background:#f5f6fc}*{box-sizing:border-box}body{margin:0}.top{background:#21183c;color:#fff;padding:16px 22px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}.top strong{font-size:18px}.top button,.action{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.top button{margin-left:auto;background:#fff;color:#25184a}.wrap{max-width:1200px;margin:22px auto;padding:0 16px}.head,.lesson{background:white;border:1px solid #e2e5f0;border-radius:18px;padding:20px;margin-bottom:16px}.muted{color:#66738e}.frame{height:calc(100vh - 245px);min-height:520px;background:#fff;border:1px solid #e2e5f0;border-radius:16px;overflow:hidden}iframe{width:100%;height:100%;border:0;background:#fff}.action{background:#673de6;color:white}.status{margin-left:auto;color:#d8ffdf;font-size:13px}.error{color:#a3213a;background:#fff0f2;border-radius:12px;padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}@media(max-width:650px){.frame{height:calc(100vh - 290px);min-height:420px}.top{padding:12px}.wrap{padding:0 10px;margin:12px auto}}
</style></head><body><header class="top"><strong>🎬 READY CLASS · Área do aluno</strong><span class="status" id="status">Carregando…</span><button onclick="location.href='./index.html'">← Voltar ao dashboard</button></header>
<main class="wrap"><section class="head"><h1 id="title">Carregando sua aula…</h1><div class="muted" id="meta">Sua aula atribuída pelo professor</div><p class="muted" id="note"></p><div class="actions"><button class="action" id="complete">✓ Marcar como concluída</button></div></section><section class="frame"><iframe id="lesson" title="Aula interativa" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe></section><p class="muted">Seu progresso nesta atribuição é acompanhado pela plataforma. Use “Voltar ao dashboard” para retornar às suas aulas.</p></main>
<script>
function showPageError(message){
 const title=document.getElementById('title'),meta=document.getElementById('meta'),status=document.getElementById('status');
 if(title)title.textContent='Não foi possível abrir a aula';
 if(meta){meta.innerHTML='';const box=document.createElement('div');box.className='error';box.textContent=message;meta.appendChild(box)}
 if(status)status.textContent='Atenção';
}
function bootReadyClass(){
 try{
  if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('A biblioteca de conexão não foi carregada. Verifique sua conexão e atualize a página.');
  const supabaseClient=window.supabase.createClient('https://rvgcniaowzmsudzliozf.supabase.co','sb_publishable_N_xCS0lbbTvG7qWTpAw0ag_vlg1lbHb');
  const assignmentId=new URLSearchParams(location.search).get('assignment');let assignment=null;
  const $=id=>document.getElementById(id);
  async function init(){
   if(!assignmentId)throw new Error('O link da atribuição está incompleto.');
   const {data:{session},error:se}=await supabaseClient.auth.getSession();
   if(se)throw new Error('Não foi possível verificar seu login: '+se.message);
   if(!session)throw new Error('Você não está conectado nesta janela. Abra a Teacher Platform na mesma janela do navegador, entre com sua conta de aluno e clique novamente em LESSONS RECEBIDAS. Se estiver usando navegação anônima, faça login nela primeiro.');
   const {data:student,error:ste}=await supabaseClient.from('tic_students').select('id').eq('auth_user_id',session.user.id).maybeSingle();
   if(ste)throw new Error('Erro ao verificar o cadastro do aluno: '+ste.message);
   if(!student)throw new Error('Seu usuário autenticado ainda não está vinculado a um cadastro de aluno.');
   const {data:a,error:ae}=await supabaseClient.from('tic_ready_class_assignments').select('id,ready_class_id,student_id,teacher_id,note,status,assigned_at').eq('id',assignmentId).eq('student_id',student.id).maybeSingle();
   if(ae)throw new Error('Não foi possível carregar a atribuição: '+ae.message);
   if(!a)throw new Error('Esta aula não foi encontrada nas atribuições desta conta. Confirme se entrou com o aluno correto.');
   const {data:l,error:le}=await supabaseClient.from('tic_ready_classes').select('id,title,description,cefr_level,duration_minutes,html_content').eq('id',a.ready_class_id).maybeSingle();
   if(le)throw new Error('Não foi possível carregar o conteúdo: '+le.message);
   if(!l)throw new Error('O conteúdo desta aula não está disponível.');
   assignment=a;
   $('title').textContent=l.title||'Aula Ready Class';
   $('meta').textContent=(l.cefr_level||'A0')+' · '+(l.duration_minutes||60)+' min · Aula interativa';
   $('note').textContent=a.note?'Mensagem do professor: '+a.note:'';
   $('lesson').srcdoc=l.html_content||'<p>Esta aula não possui conteúdo HTML.</p>';
   $('status').textContent=a.status==='completed'?'Concluída':'Aula aberta';
   $('complete').disabled=a.status==='completed';
   if(a.status==='completed')$('complete').textContent='✓ Aula concluída';
   if(a.status!=='completed'){
    const now=new Date().toISOString();
    const {error}=await supabaseClient.from('tic_ready_class_assignments').update({status:'in_progress',opened_at:now,updated_at:now}).eq('id',a.id).eq('student_id',student.id);
    if(error)$('status').textContent='Aula aberta · progresso não atualizado';
   }
  }
  $('complete').addEventListener('click',async()=>{
   if(!assignment)return;
   const btn=$('complete');btn.disabled=true;
   const {error}=await supabaseClient.from('tic_ready_class_assignments').update({status:'completed',completed_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',assignment.id).eq('student_id',assignment.student_id);
   if(error){btn.disabled=false;$('status').textContent='Erro ao concluir';alert('Não foi possível registrar a conclusão: '+error.message);return}
   $('status').textContent='Concluída';btn.textContent='✓ Aula concluída';
  });
  init().catch(e=>showPageError(e&&e.message?e.message:'Erro inesperado ao carregar a aula.'));
 }catch(e){showPageError(e&&e.message?e.message:'Erro ao iniciar a página da aula.')}
}
function loadSupabaseFallback(){
 if(window.supabase&&typeof window.supabase.createClient==='function'){bootReadyClass();return}
 const fallback=document.createElement('script');
 fallback.src='https://unpkg.com/@supabase/supabase-js@2';
 fallback.onload=bootReadyClass;
 fallback.onerror=function(){showPageError('Não foi possível carregar a biblioteca Supabase (CDN principal e alternativa falharam). Verifique a conexão, desative bloqueadores para este site e atualize a página.')};
 document.head.appendChild(fallback);
}
window.addEventListener('error',function(e){if(e&&e.message)showPageError('Erro de JavaScript: '+e.message)});
const primary=document.createElement('script');
primary.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
primary.onload=bootReadyClass;
primary.onerror=loadSupabaseFallback;
document.head.appendChild(primary);
</script></body></html>
