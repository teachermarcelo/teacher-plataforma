<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ready Class · Aula do aluno</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17233e;background:#f5f6fc}*{box-sizing:border-box}body{margin:0}.top{background:#21183c;color:#fff;padding:16px 22px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}.top strong{font-size:18px}.top button,.action{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.top button{margin-left:auto;background:#fff;color:#25184a}.wrap{max-width:1200px;margin:22px auto;padding:0 16px}.head,.lesson{background:white;border:1px solid #e2e5f0;border-radius:18px;padding:20px;margin-bottom:16px}.muted{color:#66738e}.frame{height:calc(100vh - 245px);min-height:520px;background:#fff;border:1px solid #e2e5f0;border-radius:16px;overflow:hidden}iframe{width:100%;height:100%;border:0;background:#fff}.action{background:#673de6;color:white}.status{margin-left:auto;color:#d8ffdf;font-size:13px}.error{color:#a3213a;background:#fff0f2;border-radius:12px;padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}@media(max-width:650px){.frame{height:calc(100vh - 290px);min-height:420px}.top{padding:12px}.wrap{padding:0 10px;margin:12px auto}}
</style></head><body><header class="top"><strong>🎬 READY CLASS · Área do aluno</strong><span class="status" id="status">Carregando…</span><button onclick="location.href='./index.html'">← Voltar ao dashboard</button></header>
<main class="wrap"><section class="head"><h1 id="title">Carregando sua aula…</h1><div class="muted" id="meta">Sua aula atribuída pelo professor</div><p class="muted" id="note"></p><div class="actions"><button class="action" id="complete">✓ Marcar como concluída</button></div></section><section class="frame"><iframe id="lesson" title="Aula interativa" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe></section><p class="muted">Seu progresso nesta atribuição é acompanhado pela plataforma. Use “Voltar ao dashboard” para retornar às suas aulas.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const supabase=window.supabase.createClient('https://rvgcniaowzmsudzliozf.supabase.co','sb_publishable_N_xCS0lbbTvG7qWTpAw0ag_vlg1lbHb');
const assignmentId=new URLSearchParams(location.search).get('assignment');let assignment=null;
const $=id=>document.getElementById(id);
function fail(msg){$('title').textContent='Não foi possível abrir a aula';$('meta').innerHTML='<div class="error"></div>';$('meta').firstChild.textContent=msg;$('status').textContent='Erro'}
async function init(){
 if(!assignmentId)return fail('O link da atribuição está incompleto.');
 const {data:{session},error:se}=await supabase.auth.getSession();if(se||!session)return fail('Sua sessão expirou. Entre novamente na plataforma e abra a aula recebida.');
 const {data:student,error:ste}=await supabase.from('tic_students').select('id').eq('auth_user_id',session.user.id).maybeSingle();if(ste||!student)return fail(ste?.message||'Cadastro de aluno não encontrado.');
 const {data:a,error:ae}=await supabase.from('tic_ready_class_assignments').select('id,ready_class_id,student_id,teacher_id,note,status,assigned_at').eq('id',assignmentId).eq('student_id',student.id).maybeSingle();if(ae||!a)return fail(ae?.message||'Esta aula não está atribuída a esta conta.');
 const {data:l,error:le}=await supabase.from('tic_ready_classes').select('id,title,description,cefr_level,duration_minutes,html_content').eq('id',a.ready_class_id).maybeSingle();if(le||!l)return fail(le?.message||'O conteúdo da aula não está disponível.');
 assignment=a;$('title').textContent=l.title||'Aula Ready Class';$('meta').textContent=(l.cefr_level||'A0')+' · '+(l.duration_minutes||60)+' min · Aula interativa';$('note').textContent=a.note?'Mensagem do professor: '+a.note:'';$('lesson').srcdoc=l.html_content||'<p>Esta aula não possui conteúdo HTML.</p>';$('status').textContent=a.status==='completed'?'Concluída':'Aula aberta';
 if(a.status!=='completed'){const now=new Date().toISOString();const {error}=await supabase.from('tic_ready_class_assignments').update({status:'in_progress',opened_at:now,updated_at:now}).eq('id',a.id).eq('student_id',student.id);if(error)$('status').textContent='Aula aberta · progresso não atualizado'}
}
$('complete').addEventListener('click',async()=>{if(!assignment)return;const {error}=await supabase.from('tic_ready_class_assignments').update({status:'completed',completed_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',assignment.id).eq('student_id',assignment.student_id);if(error){$('status').textContent='Erro ao concluir';alert('Não foi possível registrar a conclusão: '+error.message);return}$('status').textContent='Concluída';$('complete').textContent='✓ Aula concluída';$('complete').disabled=true});
init().catch(e=>fail(e.message||'Erro ao carregar a aula.'));
</script></body></html>
